<style>
:root{--canvas:#181818;--surface:#262626;--ink:#fafafa;--muted:#a3a3a3;--font:Inter,Arial,Helvetica,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--canvas)}
body{color:var(--ink);font:400 16px/1.5 var(--font);letter-spacing:-.009em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.scene{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--canvas)}
/* Fact line + pill share one bottom-centred column, so the fact always sits just above the pill. */
.dock{position:fixed;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.fact{max-width:min(560px,100%);min-height:1.45em;text-align:center;color:var(--muted);font-size:13px;line-height:1.45;text-shadow:0 0 2px rgba(24,24,24,.9),0 0 12px rgba(24,24,24,.9);opacity:0;transition:opacity 1.2s ease}
.fact.on{opacity:1}
.player{pointer-events:auto;width:min(448px,calc(100vw - 48px));padding:12px 12px 8px 20px;background:var(--surface);border-radius:16px}
.now{display:flex;flex-wrap:wrap;column-gap:8px;padding-right:8px;line-height:1.18}
.title{color:var(--ink)}.composer{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0 0 -12px}
.control{display:grid;place-items:center;width:44px;height:44px;flex:none;padding:0;border:0;border-radius:12px;background:none;color:var(--ink);cursor:pointer;transition:opacity 120ms}
.control svg{width:20px;height:20px;fill:currentColor}
.control:hover{opacity:.72}
.control.play{border-radius:50%;background:var(--ink);color:var(--canvas)}
.volume{display:flex;align-items:center;gap:4px;flex:1 1 140px;min-width:0;margin-left:auto}
.volume input{flex:1;min-width:64px;height:44px;margin:0 8px 0 0;accent-color:var(--ink);background:transparent;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.label{position:fixed;left:16px;bottom:16px;max-width:200px;font-size:11px;line-height:1.35;color:var(--muted);text-shadow:0 0 8px rgba(24,24,24,.9)}
.label b{display:block;color:var(--ink);font-weight:500}
@media (max-width:959px){
  .label{right:16px;bottom:8px;max-width:none}
  .label b{display:inline}
  .dock{bottom:60px}
}
@media (prefers-reduced-motion:reduce){.fact,.control{transition:none}}
</style>
</head>

<p class="label"><b>Concept 1 — Whisper</b> One quiet line above the player; a tiny blinking pixel marks what it’s about in the painting. Mock: a fact every ~7s (real: one every ~40s).</p>

"use strict";
const W=160,H=100,FPS=10,FADE=2.5,SHOW=4.8,GAP=2.4;
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
let B=new Uint8Array(W*H);

// ---- tiny indexed rasterizer (same approach as lib/raster.ts) ----
function fill(pts,a,b=a,lv=0){
  let y0=1e9,y1=-1e9;for(const p of pts){if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
  y0=Math.max(0,Math.floor(y0));y1=Math.min(H-1,Math.ceil(y1));const xs=[];
  for(let y=y0;y<=y1;y++){const sy=y+.5;xs.length=0;

      for(let x=xa;x<=xb;x++)B[y*W+x]=lv>0&&BAY[(y&3)*4+(x&3)]<lv?b:a}}
}
function dot(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<W&&y<H)B[y*W+x]=c}
function line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){dot(x0,y0,c);if(x0===x1&&y0===y1)return;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function thick(x0,y0,x1,y1,c){line(x0,y0,x1,y1,c);line(x0+1,y0,x1+1,y1,c)}
function stroke(pts,c){for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];line(p[0],p[1],q[0],q[1],c)}}
function ell(cx,cy,rx,ry,from=0,to=Math.PI*2,n=24){const pts=[],full=Math.abs(to-from-Math.PI*2)<1e-6;

function rect(x,y,w,h){return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
function seeded(s){return()=>{s=(s+0x6d2b79f5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function clipHalf(poly,o,n){const side=p=>(p[0]-o[0])*n[0]+(p[1]-o[1])*n[1],out=[];
  for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],sp=side(p),sq=side(q);
    if(sp>=0)out.push(p);if(sp>=0!==sq>=0){const t=sp/(sp-sq);out.push([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t])}}return out}

  const s=area>0?1:-1;let out=poly;for(let i=0;i<cl.length&&out.length;i++){const a=cl[i],b=cl[(i+1)%cl.length];out=clipHalf(out,a,[-(b[1]-a[1])*s,(b[0]-a[0])*s])}return out}

    let cx=0,cy=0;for(const p of poly){cx+=p[0];cy+=p[1]}

    split(clipConvex(poly,half(o,n)),d-1);split(clipConvex(poly,half(o,[-n[0],-n[1]])),d-1)};

    fill(D([[63,61],[97,61],[124,102],[36,102]],f,.5),1,2,5);
    fill(D([[34,72],[112,69],[56,56]],f,.4),0,2,3);stroke([[34,72],[112,69],[56,56]],3);
    fill([[28,74],[112,70],[128,77],[112,84],[28,86]],0,1,2);stroke([[28,74],[112,70],[128,77],[112,84]],3);
    fill(rect(30,76,26,3),6);for(let x=31;x<56;x+=3)if(x%7)dot(x,76,0);
    for(const x of[32,108])thick(x,86,x,97,1);
  },
  m:{piano:()=>[66,72],window:()=>[70,12],rooftops:()=>[83,38]},
  facts:[["Chopin wrote it around 1830–31, when he was about twenty, and it was published in 1832.","piano"],
    ["The nocturne, a dreamy “night piece” for piano, was invented by the Irish composer John Field. Chopin made the form famous.","window"],
    ["Chopin left Poland in 1830 and never went back. From 1831 he made his home in Paris.","rooftops"],
    ["Each time the melody comes back, Chopin decorates it a little more, like an opera singer ornamenting a tune."],
    ["It is in 12/8 time: four slow beats, each divided into three."]]
}];

// ---- scene ----
const cv=document.getElementById("art"),ctx=cv.getContext("2d");cv.width=W;cv.height=H;
const img=ctx.createImageData(W,H),out=new Uint32Array(img.data.buffer);
const toPx=h=>{const n=parseInt(h.slice(1),16);return(0xff<<24)|((n&0xff)<<16)|(n&0xff00)|((n>>16)&0xff)};
const luts=P.map(p=>Uint32Array.from(p.colors,toPx));
const bufA=new Uint8Array(W*H),bufB=new Uint8Array(W*H),noise=new Float32Array(W*H);
for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const v=Math.random();noise[y*W+x]=noise[y*W+x+1]=noise[(y+1)*W+x]=noise[(y+1)*W+x+1]=v}
const reduce=matchMedia("(prefers-reduced-motion: reduce)");

let cur=0,nxt=-1,fade=-1,sim=30,energy=.35,playing=false,last=0;
let fi=0,ft=-1.2,shown=false,key={},env=0;
const $=id=>document.getElementById(id),factEl=$("fact");

function setTrack(i){const p=P[i];$("title").textContent=p.title;$("composer").textContent=p.composer;cv.setAttribute("aria-label","Background painting. "+p.alt)}
function hideFact(){factEl.classList.remove("on");shown=false}

function blend(x,y,rgb,a){if(x<0||y<0||x>=W||y>=H||a<=0)return;const i=y*W+x,v=out[i];
  const r=v&255,g=(v>>8)&255,b=(v>>16)&255;
  out[i]=(0xff<<24)|(Math.round(b+(rgb[2]-b)*a)<<16)|(Math.round(g+(rgb[1]-g)*a)<<8)|Math.round(r+(rgb[0]-r)*a)}
// The only pointer: a 2×2 Bone dot with a faint Obsidian ring, softly blinking.
function marker(m,a){const x=Math.round(m[0]),y=Math.round(m[1]);
  for(let dy=-1;dy<=2;dy++)for(let dx=-1;dx<=2;dx++){const core=dx>=0&&dx<=1&&dy>=0&&dy<=1,corner=(dx===-1||dx===2)&&(dy===-1||dy===2);
    if(corner)continue;blend(x+dx,y+dy,core?[250,250,250]:[24,24,24],core?a:a*.55)}}

function draw(){
  const f={t:sim,still:reduce.matches};
  B=bufA;B.fill(0);P[cur].draw(f);const la=luts[cur];
  if(fade<0){for(let i=0;i<out.length;i++)out[i]=la[bufA[i]]}
  else{B=bufB;B.fill(0);P[nxt].draw(f);const lb=luts[nxt],p=fade/FADE;for(let i=0;i<out.length;i++)out[i]=noise[i]<p?lb[bufB[i]]:la[bufA[i]]}
  const fact=P[cur].facts[fi];
  if(fade<0&&fact&&fact[1]&&env>.01){
    const pulse=reduce.matches?1:.6+.4*Math.sin(performance.now()/1000*2.4);
    marker(P[cur].m[fact[1]](f,key),env*pulse)}
  ctx.putImageData(img,0,0);
}

function step(dt){
  energy+=((playing?1:.35)-energy)*.03;
  if(!reduce.matches)sim+=dt*energy;
  if(fade>=0){fade+=dt;if(fade>=FADE){cur=nxt;nxt=-1;fade=-1}}
  if(playing){ft+=dt;
    if(ft>=0&&!shown&&ft<SHOW&&fade<0){const fact=P[cur].facts[fi];key={};factEl.textContent=fact[0];
      void factEl.offsetWidth;factEl.classList.add("on");shown=true}
    if(ft>=SHOW){hideFact();fi=(fi+1)%P[cur].facts.length;ft=-GAP}}
  const target=shown?1:0;env=reduce.matches?target:env+(target-env)*Math.min(1,dt*1.6);
}

function frame(ms){requestAnimationFrame(frame);if(ms-last<1000/FPS)return;
  const dt=last?Math.min((ms-last)/1000,.25):0;last=ms;if(document.hidden)return;step(dt);draw()}

function toggle(){playing=!playing;
  $("play").setAttribute("aria-label",playing?"Pause":"Play");
  $("playGlyph").setAttribute("d",playing?"M5 4h3.5v12H5zM11.5 4H15v12h-3.5z":"M6 3.5v13L16.5 10z");
  if(!playing){hideFact();env=reduce.matches?0:env;ft=-1.2}}
function next(){
  if(fade>=0){cur=nxt;nxt=-1;fade=-1}
  const to=(cur+1)%P.length;
  hideFact();env=0;fi=0;
  if(reduce.matches){cur=to;ft=-1.2}else{nxt=to;fade=0;ft=-(FADE+.6)}
  setTrack(to);
}
// Title/composer switch at once; the painting below dissolves from `cur` into `nxt`.

$("play").addEventListener("click",toggle);
$("next").addEventListener("click",next);
let vol=80,muted=false;const volEl=$("vol");
function syncVol(){const silent=muted||vol===0;volEl.value=muted?0:vol;volEl.setAttribute("aria-valuetext",(muted?0:vol)+"%");
  $("mute").setAttribute("aria-label",silent?"Unmute":"Mute");
  $("volGlyph").setAttribute("d",silent?"M13.3 7.3l1.1-1.1 1.8 1.8 1.8-1.8 1.1 1.1-1.8 1.8 1.8 1.8-1.1 1.1-1.8-1.8-1.8 1.8-1.1-1.1 1.8-1.8z":"M13.2 6.6a4.8 4.8 0 0 1 0 6.8l-1.1-1.1a3.2 3.2 0 0 0 0-4.6zM15.3 4.5a7.8 7.8 0 0 1 0 11l-1.1-1.1a6.2 6.2 0 0 0 0-8.8z")}
volEl.addEventListener("input",()=>{vol=+volEl.value;if(vol>0)muted=false;syncVol()});
$("mute").addEventListener("click",()=>{if(vol===0){vol=60;muted=false}else muted=!muted;syncVol()});
document.addEventListener("keydown",e=>{if(e.key!==" "||e.repeat||e.defaultPrevented)return;
  if(e.target.closest&&e.target.closest("button,input,a,select,textarea"))return;e.preventDefault();toggle()});

setTrack(cur);syncVol();draw();requestAnimationFrame(frame);
</script>
</body>
</html>
