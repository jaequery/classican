<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liner Notes</title>
<style>
:root{--canvas:#181818;--surface:#262626;--ink:#fafafa;--muted:#a3a3a3;--font:Inter,Arial,Helvetica,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--canvas)}
body{color:var(--ink);font:400 16px/1.5 var(--font);letter-spacing:-.009em;-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--canvas)}
.scene{position:absolute;left:0;top:0;display:block;transform-origin:0 0;image-rendering:pixelated;image-rendering:crisp-edges;will-change:transform}
.player{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(448px,calc(100% - 48px));max-height:calc(100% - 48px);overflow-y:auto;padding:12px 12px 8px 20px;background:var(--surface);border-radius:16px}
.now{display:flex;flex-wrap:wrap;column-gap:8px;padding-right:8px;line-height:1.18}
.title{color:var(--ink)}.composer{color:var(--muted)}
/* The one addition: a liner-note line. Its height eases to fit the next fact. */
.note{overflow:hidden;transition:height .9s cubic-bezier(.25,.8,.25,1)}
.fact{padding:7px 8px 0 0;font-size:13px;line-height:1.42;color:var(--muted);transition:opacity .7s ease}
.fact.out{opacity:0}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0 0 -12px}
.control{display:grid;place-items:center;width:44px;height:44px;flex:none;padding:0;border:0;border-radius:12px;background:none;color:var(--ink);cursor:pointer;transition:opacity 120ms}
.control svg{width:20px;height:20px;fill:currentColor}
.control:hover{opacity:.72}
.control.play{border-radius:50%;background:var(--ink);color:var(--canvas)}
.volume{display:flex;align-items:center;gap:4px;flex:1 1 140px;min-width:0;margin-left:auto}
.volume input{flex:1;min-width:64px;height:44px;margin:0 8px 0 0;accent-color:var(--ink);background:transparent;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.label{position:fixed;left:16px;bottom:16px;max-width:260px;font-size:11px;line-height:1.4;color:var(--muted);background:rgba(24,24,24,.82);padding:6px 9px;border-radius:8px}
.label b{color:var(--ink);font-weight:500}
@media (max-width:1000px){.label{top:16px;bottom:auto;max-width:calc(100% - 32px)}}
@media (prefers-reduced-motion:reduce){.note,.fact,.control{transition:none}}
</style>
</head>
<body>
<div class="stage"><canvas class="scene" id="scene" width="160" height="100" role="img" aria-label=""></canvas></div>

<section class="player" aria-label="Music player">
  <p class="now"><span class="title" id="title"></span><span class="composer" id="composer"></span></p>
  <div class="note" id="note"><p class="fact" id="fact"></p></div>
  <div class="controls">
    <button type="button" class="control play" id="play" aria-label="Play"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="playIcon" d="M6 3.5v13L16.5 10z"/></svg></button>
    <button type="button" class="control" id="next" aria-label="Next piece"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 4h2v12h-2zM4 4v12l8.5-6z"/></svg></button>
    <div class="volume">
      <button type="button" class="control" id="mute" aria-label="Mute"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3.5L11 4v12l-4.5-3.5H3z"/><path id="volIcon" d="M13.2 6.6a4.8 4.8 0 0 1 0 6.8l-1.1-1.1a3.2 3.2 0 0 0 0-4.6zM15.3 4.5a7.8 7.8 0 0 1 0 11l-1.1-1.1a6.2 6.2 0 0 0 0-8.8z"/></svg></button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </div>
</section>

<p class="label"><b>Concept 3 — Liner notes</b><br>No new elements: one muted line in the pill carries the fact, and the painting's camera drifts slowly toward what it names. Mock: a fact every 7s (real: one every ~40s).</p>

<script>
(() => {
const W = 160, H = 100, FACT_SECONDS = 7, MAX_ZOOM = 1.15;
const BAY = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const buf = new Uint8Array(W * H);
const PI = Math.PI;

// ---- tiny indexed rasterizer -------------------------------------------
function fill(pts, a, b = a, lv = 0) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  y0 = Math.max(0, Math.floor(y0)); y1 = Math.min(H - 1, Math.ceil(y1));
  const xs = [];
  for (let y = y0; y <= y1; y++) {
    const sy = y + .5; xs.length = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if (yi > sy !== yj > sy) xs.push(xi + (sy - yi) / (yj - yi) * (xj - xi));
    }
    xs.sort((m, n) => m - n);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.max(0, Math.ceil(xs[k] - .5)), xb = Math.min(W - 1, Math.ceil(xs[k + 1] - .5) - 1);
      for (let x = xa; x <= xb; x++) buf[y * W + x] = lv > 0 && BAY[(y & 3) * 4 + (x & 3)] < lv ? b : a;
    }
  }
}
function dot(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; }
function line(x0, y0, x1, y1, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) dot(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c);
}
function bar(x0, y0, x1, y1, w, c) {
  const l = Math.hypot(x1 - x0, y1 - y0) || 1, nx = -(y1 - y0) / l * w / 2, ny = (x1 - x0) / l * w / 2;
  fill([[x0 + nx, y0 + ny], [x1 + nx, y1 + ny], [x1 - nx, y1 - ny], [x0 - nx, y0 - ny]], c);
}
function ell(cx, cy, rx, ry, n = 22, a0 = 0, a1 = 2 * PI) {
  const pts = [], full = Math.abs(a1 - a0 - 2 * PI) < 1e-6;
  for (let i = 0; i < (full ? n : n + 1); i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return pts;
}
const rc = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function rng(s) { return () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(x, y) { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); }
const wave = (F, sp, ph = 0) => F.still ? 0 : Math.sin(F.t * sp + ph);
function drift(p, F) {
  if (F.still) return p;
  const kx = Math.round(p[0] * 4), ky = Math.round(p[1] * 4);
  return [p[0] + Math.sin(F.t * .31 + hash(kx, ky) * 6.28) * .9, p[1] + Math.cos(F.t * .23 + hash(ky, kx) * 6.28) * .9];
}
function clip(poly, o, n) {
  const s = p => (p[0] - o[0]) * n[0] + (p[1] - o[1]) * n[1], out = [];
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length], a = s(p), b = s(q);
    if (a >= 0) out.push(p);
    if (a >= 0 !== b >= 0) { const k = a / (a - b); out.push([p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]); }
  }
  return out;
}
// Split the canvas into angular planes by repeated straight cuts.
function fracture(seed, pairs, depth, box = [[-8, -8], [W + 8, -8], [W + 8, H + 8], [-8, H + 8]]) {
  const r = rng(seed), out = [];
  const split = (poly, d) => {
    if (poly.length < 3) return;
    if (!d) { const pr = pairs[r() * pairs.length | 0]; out.push({ pts: poly, a: pr[0], b: pr[1], lv: [0, 3, 6, 8][r() * 4 | 0], ph: r() * 6.28 }); return; }
    let cx = 0, cy = 0; for (const p of poly) { cx += p[0]; cy += p[1]; }
    const o = [cx / poly.length + (r() - .5) * 16, cy / poly.length + (r() - .5) * 12];
    const ang = (r() < .5 ? .35 : 1.2) + r() * 1.1 + (r() < .5 ? PI / 2 : 0), n = [Math.cos(ang), Math.sin(ang)];
    split(clip(poly, o, n), d - 1); split(clip(poly, o, [-n[0], -n[1]]), d - 1);
  };
  split(box, depth);
  return out;
}
function planes(list, F) {
  for (const p of list) fill(p.pts.map(q => drift(q, F)), p.a, p.b, Math.max(0, Math.min(10, p.lv + Math.round(wave(F, .09, p.ph) * 2))));
}

// ---- five paintings, one per piece ---------------------------------------
const gymBg = fracture(3, [[4, 0], [2, 4], [0, 4]], 5);
const gymBand = fracture(4, [[1, 5], [1, 2], [5, 1]], 4, rc(-4, 26, W + 8, 52));
function meander(y) {
  fill(rc(0, y, W, 8), 0);
  for (let x = -2; x < W; x += 8) { line(x, y + 6, x, y + 2, 3); line(x, y + 2, x + 5, y + 2, 3); line(x + 5, y + 2, x + 5, y + 5, 3); line(x + 5, y + 5, x + 3, y + 5, 3); }
}
function dancer(x, b, ph, F) {
  const s = wave(F, .9, ph);
  fill(ell(x + 1, b + 6, 3, 3.4, 12), 0); fill(ell(x - 2, b + 4, 1.6, 1.6, 8), 0);
  fill([[x + 3, b + 5], [x + 5.5, b + 7.5], [x + 3, b + 8.5]], 0);
  bar(x + .5, b + 9, x + .5, b + 12.5, 2, 0);
  fill([[x - 3, b + 12], [x + 4, b + 12], [x + 2.5, b + 24], [x - 2.5, b + 24]], 0);
  fill([[x + .5, b + 12], [x + 4, b + 12], [x + 2.5, b + 24], [x + .5, b + 24]], 2);
  fill([[x - 3, b + 22], [x + 3, b + 22], [x + 7 + s * 2, b + 36], [x - 7 + s * 2, b + 36]], 0);
  line(x, b + 24, x + s, b + 35, 2);
  bar(x - 2, b + 35, x - 4 - s * 3, b + 44, 2, 0); bar(x + 2, b + 35, x + 5 + s * 3, b + 44, 2, 0);
  bar(x + 3, b + 13, x + 9, b + 8 - s * 2, 1.8, 0); bar(x + 9, b + 8 - s * 2, x + 11, b + 2 - s * 2, 1.6, 0);
  bar(x - 3, b + 13, x - 8, b + 18 + s * 2, 1.8, 0); bar(x - 8, b + 18 + s * 2, x - 12, b + 15, 1.6, 0);
}

const clairBg = fracture(11, [[0, 1], [1, 2], [0, 0]], 5);
function masked(x, F, hat) {
  const s = wave(F, .4, x) * .8;
  fill([[x - 6, 82], [x + s, 58], [x + 6, 82]], 8);
  fill([[x + s, 58], [x + 6, 82], [x + s, 82]], 1, 8, 6);
  fill(ell(x + s, 55, 3.4, 4, 12), 7);
  dot(x + s - 1.5, 54, 0); dot(x + s + 1.5, 54, 0);
  if (hat) fill([[x + s - 3, 52], [x + s, 42], [x + s + 3, 52]], 7);
  else fill([[x + s - 6, 52.5], [x + s, 47.5], [x + s + 6, 52.5]], 0);
}

const bachBg = fracture(23, [[0, 1], [1, 0], [1, 2]], 5);
function manual(x, y, w) {
  fill(rc(x, y, w, 3), 4);
  for (let i = 0; i * 3 < w; i++) { dot(x + i * 3, y + 2, 1); if ([1, 1, 0, 1, 1, 1, 0][i % 7]) { dot(x + i * 3 + 2, y, 5); dot(x + i * 3 + 2, y + 1, 5); } }
}

const gnoBg = fracture(37, [[3, 4], [4, 3], [7, 3]], 5);
const NOTES = [[18, 2], [28, 3], [36, 1], [50, 2.5], [62, 4], [76, 2], [90, 3], [104, 1.5], [118, 2], [132, 3], [142, 1]];

const chopBg = fracture(51, [[1, 2], [2, 1], [1, 0]], 5);
const ROOFS = [[101, 71], [101, 54], [105, 54], [105, 49], [108, 49], [108, 54], [113, 58], [119, 51], [125, 57], [125, 47], [128, 47], [128, 55], [139, 55], [139, 71]];

const PIECES = [
  {
    title: "Gymnopédie No. 1", composer: "Erik Satie",
    alt: "Dancers in profile, like figures on an ancient Greek vase, moving slowly round a frieze.",
    pal: ["#15100d", "#c0602f", "#8a3d1c", "#ecd3a6", "#3a2016", "#d98a45"],
    motifs: { dancers: [80, 52], frieze: [80, 22] },
    draw(F) {
      planes(gymBg, F); planes(gymBand, F);
      meander(18); meander(78);
      for (let i = 0; i < 5; i++) {
        const x = F.still ? 16 + i * 32 : ((i * 34 + F.t * 1.1) % (W + 30)) - 15;
        dancer(x, 30, i * 1.7, F);
      }
    },
    facts: [
      ["Satie wrote his three Gymnopédies in 1888, in his early twenties.", "dancers"],
      ["The title comes from the gymnopaedia, a festival in ancient Sparta where young men danced.", "frieze"],
      ["Satie was playing piano in Montmartre cabarets, like Le Chat Noir, around the time he wrote them.", null],
      ["The score asks for it to be played “Lent et douloureux”: slow and sorrowful.", null],
      ["Claude Debussy, Satie's friend, later arranged two of the Gymnopédies for orchestra.", null],
    ],
  },
  {
    title: "Clair de lune", composer: "Claude Debussy",
    alt: "Moonlight over a park at night, with a fountain and masked figures.",
    pal: ["#0b1026", "#1b2752", "#2f4277", "#ece6c4", "#8fa3c9", "#0f1a14", "#24402f", "#d6cfee", "#4b2a5c"],
    motifs: { moon: [126, 22], fountain: [86, 64] },
    draw(F) {
      planes(clairBg, F);
      fill(ell(126, 22, 24, 19, 24), 1, 2, 6 + Math.round(wave(F, .2) * 2));
      fill(ell(126, 22, 10, 10, 20), 3);
      fill(ell(126, 22, 10, 10, 10, PI / 2, PI * 1.5), 3, 4, 5);
      fill([[0, 62], [W, 57], [W, H], [0, H]], 5, 6, 4);
      fill([[48, H], [70, 64], [92, 64], [124, H]], 6, 2, 3);
      fill([[0, 64], [12, 18], [30, 64]], 5); fill([[12, 18], [30, 64], [20, 64]], 6, 5, 6);
      fill([[146, 60], [154, 34], [162, 60]], 5);
      // fountain
      fill(ell(62, 78, 20, 4.5, 20), 4); fill(ell(62, 77.5, 17, 3, 18), 2, 4, 4 + Math.round(wave(F, 1.3) * 2));
      fill(rc(60, 62, 4, 15), 4); fill([[52, 61], [72, 61], [68, 65], [56, 65]], 4);
      line(62, 61, 62, 49, 4);
      for (let i = 0; i < 12; i++) {
        const s = ((i / 12) + (F.still ? 0 : F.t * .12)) % 1, y = 49 - Math.sin(PI * s) * 4 + s * 12;
        dot(62 - s * 9, y, s < .5 ? 3 : 4); dot(62 + s * 9, y, s < .5 ? 3 : 4);
      }
      masked(100, F, true); masked(114, F, false);
    },
    facts: [
      ["“Clair de lune” means “moonlight”. It is the third of four movements in Debussy's Suite bergamasque.", "moon"],
      ["The title comes from a poem by Paul Verlaine, which pictures masked dancers and fountains under the moon.", "fountain"],
      ["Debussy began the suite around 1890 but did not publish it until 1905, revising it first.", null],
      ["It is in D-flat major, and its opening is marked pp: very softly.", null],
    ],
  },
  {
    title: "Goldberg Variations: Aria", composer: "Johann Sebastian Bach",
    alt: "A two-keyboard harpsichord by candlelight at night.",
    pal: ["#0d0a08", "#2a1a10", "#4a2c17", "#7a4a22", "#e8dcc0", "#151210", "#ffd36e", "#f39a3a", "#a86a2a"],
    motifs: { harpsichord: [62, 42], keyboards: [38, 52], candle: [122, 40] },
    draw(F) {
      planes(bachBg, F);
      const fl = F.still ? 0 : Math.sin(F.t * 7) * .5 + Math.sin(F.t * 3.1) * .5;
      fill(ell(122, 40, 46, 34, 24), 1, 2, 5 + Math.round(fl));
      fill(ell(122, 40, 22, 18, 20), 2, 8, 3 + Math.round(fl));
      fill([[24, 47], [58, 12], [106, 43], [106, 47]], 2);
      fill([[36, 44], [58, 18], [96, 42]], 3, 8, 4);
      fill([[16, 47], [108, 47], [112, 57], [16, 58]], 3);
      fill([[16, 58], [112, 57], [112, 63], [16, 65]], 2, 3, 4);
      fill(rc(15, 45, 3, 10), 2); fill(rc(54, 45, 3, 10), 2);
      manual(19, 46, 35); manual(18, 50, 36);
      bar(22, 65, 20, 88, 2, 1); bar(60, 64, 60, 88, 2, 1); bar(104, 62, 106, 86, 2, 1);
      bar(122, 54, 122, 88, 2, 2); fill(rc(116, 86, 12, 2), 2); fill(rc(116, 52, 12, 2), 8);
      fill(rc(120, 43, 4, 9), 4);
      const fh = 6 + fl;
      fill([[122, 42 - fh], [124.5, 40], [122, 42.5], [119.5, 40]], 6); dot(122, 41, 7); dot(122, 42.5, 0);
    },
    facts: [
      ["Bach published the Goldberg Variations in 1741: this Aria, thirty variations, then the Aria again.", "harpsichord"],
      ["It was written for a harpsichord with two keyboards, so the hands can cross without colliding.", "keyboards"],
      ["Every variation is built on the bass line of this Aria, not on its tune.", null],
      ["A story says it was played to soothe a count's sleepless nights. Historians doubt it, but the young harpsichordist's name, Goldberg, stuck.", "candle"],
      ["Every third variation, up to the 27th, is a canon, where one voice imitates another.", null],
      ["This recording by Kimiko Ishizaka was crowdfunded and released into the public domain in 2012.", null],
    ],
  },
  {
    title: "Gnossienne No. 1", composer: "Erik Satie",
    alt: "The red, top-heavy columns of the palace of Knossos, and a stave with no bar lines.",
    pal: ["#1b1410", "#b9242a", "#7e1a1c", "#e2c48a", "#c49a5c", "#141110", "#f1e6cc", "#3b5f7a"],
    motifs: { columns: [58, 38], stave: [80, 82] },
    draw(F) {
      planes(gnoBg, F);
      fill(rc(0, 6, W, 8), 5); fill(rc(0, 9, W, 2), 1);
      for (const x of [24, 58, 92, 126]) {
        fill(rc(x - 9, 14, 18, 3), 5); fill(ell(x, 19, 8, 3.5, 16), 5);
        fill([[x - 6, 22], [x + 6, 22], [x + 3.5, 62], [x - 3.5, 62]], 1);
        fill([[x, 22], [x + 6, 22], [x + 3.5, 62], [x, 62]], 2, 1, 3);
        fill(rc(x - 5, 62, 10, 2), 5);
      }
      fill([[6, 69], [154, 68], [154, 95], [6, 96]], 6, 3, 2);
      for (let k = 0; k < 5; k++) line(10, 74 + k * 4, 150, 74 + k * 4, 5);
      NOTES.forEach(([x, p], i) => {
        const y = 74 + p * 4 + wave(F, .5, i) * .6;
        fill(ell(x, y, 2, 1.4, 8), 5); line(x + 2, y, x + 2, y - 7, 5);
      });
    },
    facts: [
      ["Satie’s title may come from “gnosis”, knowledge, or from an old word for a dance of Knossos on Crete.", "columns"],
      ["Satie wrote it without bar lines or a time signature.", "stave"],
      ["Besides its tempo mark, “Lent”, the score whispers odd advice, like “Très luisant” (very shiny) and “Questionnez” (ask questions).", null],
      ["It dates from around 1890. Satie may have been inspired by music he heard at the 1889 Paris World's Fair.", null],
    ],
  },
  {
    title: "Nocturne in E-flat major, Op. 9 No. 2", composer: "Frédéric Chopin",
    alt: "A piano in a dark room by a tall window, the moon and Paris rooftops outside.",
    pal: ["#0c0d12", "#1a1c26", "#2a2d3d", "#f0e6c0", "#3d5a8a", "#26375c", "#10131c", "#e6d8b0", "#d9ae52", "#6a7396"],
    motifs: { piano: [54, 56], window: [120, 30], rooftops: [120, 60] },
    draw(F) {
      planes(chopBg, F);
      fill([[101, 71], [139, 71], [100, 99], [40, 99]], 1, 2, 4);
      fill(rc(98, 6, 44, 68), 2);
      fill(rc(101, 9, 38, 62), 5, 4, 6 + Math.round(wave(F, .15) * 2));
      fill(ell(129, 21, 5, 5, 14), 3); fill(ell(129, 21, 5, 5, 7, PI / 2, PI * 1.5), 3, 4, 6);
      fill(ROOFS, 6);
      [[103, 60], [110, 62], [116, 65], [131, 60], [135, 64]].forEach(([x, y], i) => { if (F.still || Math.sin(F.t * .3 + i * 2) > -.6) dot(x, y, 8); });
      fill(rc(119, 9, 2, 62), 2); fill(rc(101, 38, 38, 2), 2);
      fill([[20, 56], [44, 33], [92, 52], [92, 56]], 0); line(20, 56, 44, 33, 9); line(44, 33, 92, 52, 9);
      fill([[18, 56], [94, 56], [90, 66], [20, 66]], 0);
      fill([[18, 56], [94, 56], [93, 58], [18, 58]], 9, 2, 6); line(94, 56, 90, 66, 9);
      fill(rc(12, 56, 22, 2), 7); for (let x = 13; x < 34; x += 2) dot(x, 56, 1);
      bar(22, 66, 22, 84, 2, 0); bar(52, 66, 52, 84, 2, 0); bar(86, 66, 86, 84, 2, 0);
      fill(rc(2, 68, 14, 3), 0); bar(4, 71, 4, 84, 1.5, 0); bar(14, 71, 14, 84, 1.5, 0);
    },
    facts: [
      ["Chopin wrote it around 1830–31, when he was about twenty, and it was published in 1832.", "piano"],
      ["The nocturne, a dreamy “night piece” for piano, was invented by the Irish composer John Field. Chopin made the form famous.", "window"],
      ["Chopin left Poland in 1830 and never went back. From 1831 he made his home in Paris.", "rooftops"],
      ["Each time the melody comes back, Chopin decorates it a little more, like an opera singer ornamenting a tune.", null],
      ["It is in 12/8 time: four slow beats, each divided into three.", null],
    ],
  },
];
const PAL32 = PIECES.map(p => p.pal.map(h => { const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; }));

// ---- page ----------------------------------------------------------------
const $ = id => document.getElementById(id);
const cv = $("scene"), ctx = cv.getContext("2d"), img = ctx.createImageData(W, H), out = new Uint32Array(img.data.buffer);
const old = new Uint8Array(W * H);
const BLOCK = 4, BW = W / BLOCK, BH = H / BLOCK;
const order = new Float32Array(BW * BH).map(() => Math.random());
const rm = matchMedia("(prefers-reduced-motion: reduce)");

let ti = 0, fi = 0, playing = false, muted = false;
let t = 0, ft = 0, last = performance.now();
let from = -1, fade = 1;            // pixel-block dissolve between paintings
let e = 0, focus = null, focusKey = ""; // camera: 0 = full frame, 1 = resting on the motif
let swapToken = 0;

function sizeCanvas() {
  const vw = innerWidth, vh = innerHeight, k = Math.max(vw / W, vh / H);
  cv.style.width = W * k + "px"; cv.style.height = H * k + "px";
  $("note").style.height = $("fact").offsetHeight + "px";
}

function showFact(animate) {
  const text = PIECES[ti].facts[fi][0], fact = $("fact"), note = $("note"), my = ++swapToken;
  if (!animate || rm.matches) { fact.textContent = text; fact.classList.remove("out"); note.style.height = fact.offsetHeight + "px"; return; }
  fact.classList.add("out");
  setTimeout(() => {
    if (my !== swapToken) return;
    fact.textContent = text;
    note.style.height = fact.offsetHeight + "px"; // the pill grows or shrinks to the new fact
    requestAnimationFrame(() => fact.classList.remove("out"));
  }, 700);
}

function showPiece() {
  const p = PIECES[ti];
  $("title").textContent = p.title; $("composer").textContent = p.composer;
  cv.setAttribute("aria-label", p.alt);
}

function setPlaying(on) {
  playing = on;
  $("play").setAttribute("aria-label", on ? "Pause" : "Play");
  $("playIcon").setAttribute("d", on ? "M5 4h3.5v12H5zM11.5 4H15v12h-3.5z" : "M6 3.5v13L16.5 10z");
}

function next() {
  from = ti; fade = rm.matches ? 1 : 0;
  ti = (ti + 1) % PIECES.length; fi = 0; ft = 0;
  showPiece(); showFact(true);
}

const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

function camera() {
  const vw = innerWidth, vh = innerHeight, k = Math.max(vw / W, vh / H), cw = W * k, ch = H * k;
  const z = 1 + (MAX_ZOOM - 1) * e;
  let tx = (vw - z * cw) / 2, ty = (vh - z * ch) / 2;
  if (focus && e > 0) {
    // Bring the motif toward the middle of the space above the player, never past the painting's edge.
    tx += (vw / 2 - z * focus[0] * k - tx) * e;
    ty += (vh * .42 - z * focus[1] * k - ty) * e;
  }
  tx = Math.min(0, Math.max(vw - z * cw, tx)); ty = Math.min(0, Math.max(vh - z * ch, ty));
  cv.style.transform = `translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0) scale(${z.toFixed(4)})`;
}

function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const still = rm.matches;
  t += dt * (playing ? 1 : .35);
  if (playing) {
    ft += dt;
    if (ft >= FACT_SECONDS) { ft = 0; fi = (fi + 1) % PIECES[ti].facts.length; showFact(true); }
  }

  // Camera: lean toward the fact's motif, ease back to full frame before the next fact. Rest when paused.
  const m = PIECES[ti].facts[fi][1], key = ti + ":" + m;
  let target = 0;
  if (!still && playing && m) {
    if (focusKey === key) target = ss(.3, FACT_SECONDS * .6, ft) * (1 - ss(FACT_SECONDS * .8, FACT_SECONDS, ft));
    else if (e < .01) { focus = PIECES[ti].motifs[m]; focusKey = key; }
  }
  e = still ? 0 : e + (target - e) * Math.min(1, dt * 1.6);

  // Paint (and dissolve block by block into the next painting).
  const F = { t, still };
  if (fade < 1) {
    fade = Math.min(1, fade + dt / 1.6);
    buf.fill(0); PIECES[from].draw(F); old.set(buf);
  }
  buf.fill(0); PIECES[ti].draw(F);
  const pn = PAL32[ti], po = fade < 1 ? PAL32[from] : null;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    out[i] = po && order[(y >> 2) * BW + (x >> 2)] >= fade ? po[old[i]] : pn[buf[i]];
  }
  ctx.putImageData(img, 0, 0);
  camera();
  requestAnimationFrame(frame);
}

$("play").onclick = () => setPlaying(!playing);
$("next").onclick = next;
const setVolIcon = () => $("volIcon").setAttribute("d", muted || +$("vol").value === 0
  ? "M13.3 7.3l1.1-1.1 1.8 1.8 1.8-1.8 1.1 1.1-1.8 1.8 1.8 1.8-1.1 1.1-1.8-1.8-1.8 1.8-1.1-1.1 1.8-1.8z"
  : "M13.2 6.6a4.8 4.8 0 0 1 0 6.8l-1.1-1.1a3.2 3.2 0 0 0 0-4.6zM15.3 4.5a7.8 7.8 0 0 1 0 11l-1.1-1.1a6.2 6.2 0 0 0 0-8.8z");
$("mute").onclick = () => { muted = !muted; $("mute").setAttribute("aria-label", muted ? "Unmute" : "Mute"); setVolIcon(); };
$("vol").oninput = () => { muted = false; setVolIcon(); };
document.addEventListener("keydown", ev => {
  if (ev.key !== " " || ev.repeat || ev.target.closest("button,input,a")) return;
  ev.preventDefault(); setPlaying(!playing);
});
addEventListener("resize", sizeCanvas);

showPiece(); showFact(false); sizeCanvas();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
