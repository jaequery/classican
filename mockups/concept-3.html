<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Window</title>
<style>
:root{--ink:#c9d3e6;--dim:#6f7d9c;--warm:#f2c57c;--bg:#0a1026}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;display:block}
.ui{position:fixed;left:max(20px,4vw);bottom:max(20px,4vh);display:flex;align-items:center;gap:16px;
 font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink)}
button{width:40px;height:40px;flex:none;background:rgba(10,16,38,.55);border:2px solid var(--ink);color:var(--ink);
 cursor:pointer;display:grid;place-items:center;padding:0;border-radius:0;
 box-shadow:3px 3px 0 rgba(0,0,0,.45);transition:border-color .4s,color .4s,transform .1s,box-shadow .1s}
button:hover{border-color:var(--warm);color:var(--warm)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.45)}
button:focus-visible{outline:2px solid var(--warm);outline-offset:4px}
button svg{width:16px;height:16px;fill:currentColor;shape-rendering:crispEdges}
.pause{display:none}
.playing .pause{display:block}.playing .play{display:none}
.track{font-size:12px;letter-spacing:.04em;line-height:1.5;opacity:0;transition:opacity 2.2s ease;min-height:18px;
 text-shadow:0 1px 6px rgba(0,0,0,.7);max-width:calc(100vw - 100px)}
.playing .track{opacity:.8}
.track.fade{opacity:0!important}
.track i{font-style:normal;color:var(--dim)}
.mark{position:fixed;top:12px;right:14px;font:10px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--dim);opacity:.6;pointer-events:none}
@media(max-width:480px){.track{font-size:11px}.track i{display:block}}
@media(prefers-reduced-motion:reduce){.track{transition:none}button{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui" id="ui">
 <button id="b" aria-label="Play" type="button">
  <svg class="play" viewBox="0 0 8 8" aria-hidden="true"><path d="M2 1h1v6H2zM3 2h1v4H3zM4 2h1v4H4zM5 3h1v2H5zM6 3.5h1v1H6z"/></svg>
  <svg class="pause" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1h2v6H1zM5 1h2v6H5z"/></svg>
 </button>
 <div class="track" id="t" aria-live="polite"><span id="ti">Gymnopédie No. 1</span> <i id="co">— Erik Satie</i></div>
</div>
<div class="mark">Concept 3 — Night Window</div>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d');
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var W,H,stars,bld,hor,sky,lastT=0,FPS=RM?1:14;
function rnd(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(){
 var vw=innerWidth,vh=innerHeight,px=Math.max(3,Math.round(Math.min(vw,vh*1.6)/200));
 W=Math.ceil(vw/px);H=Math.ceil(vh/px);cv.width=W;cv.height=H;
 var r=rnd(7);hor=Math.floor(H*.68);
 stars=[];for(var i=0;i<Math.floor(W*hor/420);i++)stars.push({x:r()*W|0,y:r()*hor*.85|0,p:r()*6.28,s:.3+r()*.8,b:r()<.15});
 bld=[];var x=-2;
 while(x<W){var w=4+(r()*9|0),h=Math.floor(H*(.05+r()*.12)+(r()<.12?H*.08:0));
  var b={x:x,w:w,h:h,win:[]};
  for(var wx=x+1;wx<x+w-1;wx+=2)for(var wy=hor-h+2;wy<hor-1;wy+=3){
   if(r()<.55)b.win.push({x:wx,y:wy,p:r()*1000,per:40+r()*90,on:r()<.35,sw:r()});}
  bld.push(b);x+=w+(r()<.3?1+(r()*2|0):0);}
 // sky gradient
 sky=[];for(var y=0;y<hor;y++){var t=y/hor;sky.push('rgb('+(8+t*26|0)+','+(13+t*28|0)+','+(36+t*44|0)+')')}
}
function draw(t){
 var s=t/1000;
 for(var y=0;y<hor;y++){g.fillStyle=sky[y];g.fillRect(0,y,W,1)}
 for(var i=0;i<stars.length;i++){var st=stars[i];var a=RM?.6:.35+.65*(.5+.5*Math.sin(s*st.s+st.p));
  g.fillStyle='rgba('+(st.b?'255,240,210':'200,215,255')+','+a.toFixed(2)+')';g.fillRect(st.x,st.y,1,1)}
 // moon glow-less small moon
 var mx=W*.78|0,my=hor*.22|0;g.fillStyle='#e8e3cf';g.fillRect(mx,my,3,3);g.fillRect(mx-1,my+1,5,1);g.fillRect(mx+1,my-1,1,5);
 g.fillStyle='rgba(232,227,207,.05)';g.fillRect(mx-3,my-2,9,7);g.fillRect(mx-2,my-3,7,9);
 // skyline
 var lit=[];
 for(var k=0;k<bld.length;k++){var b=bld[k];
  g.fillStyle='#070b1c';g.fillRect(b.x,hor-b.h,b.w,b.h);
  g.fillStyle='#0d1530';g.fillRect(b.x,hor-b.h,b.w,1);
  for(var m=0;m<b.win.length;m++){var w=b.win[m];
   var ph=((s+w.p)%(w.per*2))<w.per; var on=RM?w.on:(w.on?ph:!ph&&w.sw<.5?false:ph&&w.sw>.5?false:w.on);
   // slow toggle: state flips per period, per-window phase
   on=RM?w.on:(((Math.floor((s+w.p)/w.per))%2===0)===w.on);
   if(on){g.fillStyle=w.sw>.7?'#ffdf9e':'#f2b765';g.fillRect(w.x,w.y,1,1);lit.push(w)}}}
 // ground strip
 g.fillStyle='#060918';g.fillRect(0,hor,W,1);
 // water
 var wh=H-hor-1;
 for(var y2=0;y2<wh;y2++){var d=y2/wh;g.fillStyle='rgb('+(6+d*4|0)+','+(10+d*6|0)+','+(26+d*10|0)+')';g.fillRect(0,hor+1+y2,W,1)}
 // reflected sky stars faint + skyline reflection
 for(var k2=0;k2<bld.length;k2++){var bb=bld[k2];
  for(var m2=0;m2<bb.win.length;m2++){var ww=bb.win[m2];
   var on2=RM?ww.on:(((Math.floor((s+ww.p)/ww.per))%2===0)===ww.on);
   if(!on2)continue;
   var dy=hor-ww.y;if(dy>wh-1)continue;
   for(var q=0;q<3;q++){var yy=hor+1+dy*1+q*0;yy=hor+dy+q*2;if(yy>=H)break;
    var sh=RM?0:Math.round(Math.sin(s*.9+yy*.7+ww.x*.3)*1.2);
    var al=(.42-dy/wh*.3)*(q?0.6:1);
    g.fillStyle='rgba(242,183,101,'+Math.max(al,.04).toFixed(2)+')';g.fillRect(ww.x+sh,yy,1,1);}}}
 // ripple lines
 for(var y3=2;y3<wh;y3+=3){var xo=RM?0:Math.floor(s*2+y3*5)%W;
  g.fillStyle='rgba(120,150,210,.07)';g.fillRect((xo*3+y3*11)%W,hor+1+y3,5+(y3%4),1);g.fillRect((xo*2+y3*29)%W,hor+1+y3,4,1)}
 // moon reflection
 for(var y4=0;y4<wh;y4+=2){var sh2=RM?0:Math.round(Math.sin(s*.7+y4)*1.5);g.fillStyle='rgba(232,227,207,'+(.2-y4/wh*.15).toFixed(2)+')';g.fillRect(mx+sh2,hor+2+y4,2,1)}
}
function loop(t){requestAnimationFrame(loop);if(t-lastT<1000/FPS)return;lastT=t;draw(t)}
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){build();draw(performance.now())},120)});
build();draw(0);if(!RM)requestAnimationFrame(loop);

// UI
var ui=document.getElementById('ui'),b=document.getElementById('b'),tr=document.getElementById('t'),
ti=document.getElementById('ti'),co=document.getElementById('co');
var P=[["Gymnopédie No. 1","Erik Satie"],["Clair de lune","Claude Debussy"],["Prelude in E minor, Op. 28 No. 4","Frédéric Chopin"]],i=0,timer,playing=false;
function show(){ti.textContent=P[i][0];co.textContent="— "+P[i][1]}
function cycle(){tr.classList.add('fade');setTimeout(function(){i=(i+1)%P.length;show();tr.classList.remove('fade')},RM?0:2300)}
b.addEventListener('click',function(){
 playing=!playing;ui.classList.toggle('playing',playing);
 b.setAttribute('aria-label',playing?'Pause':'Play');
 clearInterval(timer);if(playing)timer=setInterval(cycle,20000);
});
})();
</script>
</body>
</html>
