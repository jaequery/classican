:root{--canvas:#181818;--surface:#262626;--ink:#fafafa;--muted:#e0d6c2;--line:#3a3a3a;
--font:"Source Serif 4",Georgia,"Times New Roman",serif;--font-title:"Playfair Display",Georgia,serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--canvas)}
body{color:var(--ink);font:500 18px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit}
.scene{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
.player{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;padding:18px 16px 10px 24px;background:var(--surface);border-radius:16px;z-index:5}
.now{display:flex;flex-direction:column;row-gap:4px;padding-right:8px;line-height:1.15}
.title{font-family:var(--font-title);font-size:clamp(24px,1.6vw + 16px,32px);font-weight:600;text-wrap:balance}
.composer{color:var(--muted);font-size:clamp(18px,.6vw + 15px,21px);font-weight:600;letter-spacing:.02em}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:10px 0 0 -12px}
.control{display:grid;place-items:center;width:44px;height:44px;flex:none;padding:0;border:0;border-radius:12px;background:none;color:var(--ink);cursor:pointer;transition:opacity 120ms}
.control svg{width:20px;height:20px;fill:currentColor}
.control:hover,.textbtn:hover{opacity:.72}
.control.play{border-radius:50%;background:var(--ink);color:var(--canvas)}
.volume{display:flex;align-items:center;gap:4px;flex:1 1 140px;min-width:0;margin-left:auto}
.volume input{flex:1;min-width:64px;height:44px;margin:0 8px 0 0;accent-color:var(--ink);background:transparent;cursor:pointer}
.textbtn{height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:17px;font-weight:600;letter-spacing:.02em;cursor:pointer}
.textbtn[aria-expanded=true]{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mocklabel{position:fixed;left:16px;bottom:16px;max-width:min(300px,calc((100% - 600px)/2));font-size:13px;line-height:1.4;color:var(--muted);background:rgb(24 24 24/.82);padding:8px 12px;border-radius:8px;z-index:9}
.mocklabel b{display:block;color:var(--ink);font-weight:600}
@media (max-width:1000px){.mocklabel{display:none}}
.k{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);padding:32px 32px 40px;background:var(--surface);box-shadow:-16px 0 40px rgb(0 0 0/.4);overflow-y:auto;transform:translateX(102%);transition:transform 480ms cubic-bezier(.2,.7,.2,1);z-index:6}
.sheet.open{transform:none}
body.sheet-on .mocklabel{display:none}
@media (min-width:721px){body.sheet-on .player{left:calc((100% - 420px)/2)}.player{transition:left 480ms cubic-bezier(.2,.7,.2,1)}}
.sheet .x{position:absolute;right:16px;top:16px}
.sheet h2{font-family:var(--font-title);font-weight:600;font-size:26px;line-height:1.2;margin:28px 0 14px;padding-right:32px}
.sheet h2:first-of-type{margin-top:8px}
.sheet dl>div{padding:10px 0;border-top:1px solid var(--line)}
.sheet dd{font-size:19px;line-height:1.45;margin-top:2px}
.age{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.age b{font-family:var(--font-title);font-size:64px;line-height:1;font-weight:600}
.age span{color:var(--muted);font-size:18px;line-height:1.3}
@media (max-width:720px){.sheet{top:auto;left:0;width:100%;max-height:78vh;border-radius:16px 16px 0 0;transform:translateY(102%);padding:24px 20px 32px}.sheet.open{transform:none}}
</style>

"use strict";

const TRACKS=[{"title":"Gymnopédie No. 1","composer":"Erik Satie","year":"1888","composedYear":1888,"beforeBirthday":true,"place":"Paris, France","instruments":"Solo piano","reception":"Little noticed at first. People began to pay attention after Debussy orchestrated it in 1897."},{"title":"Clair de lune","composer":"Claude Debussy","year":"c. 1890, published 1905","composedYear":1890,"ageApprox":true,"place":"Probably Paris, France","instruments":"Solo piano","reception":"Debussy did not want to publish this early work. He agreed in 1905, when a publisher expected his later fame to sell it."},{"title":"Goldberg Variations: Aria","composer":"Johann Sebastian Bach","year":"c. 1740, published 1741","composedYear":1740,"ageApprox":true,"place":"Leipzig, Germany","instruments":"Harpsichord with two keyboards","reception":"One of the few works Bach published in his lifetime. It became widely known only after Glenn Gould’s 1955 recording."},{"title":"Gnossienne No. 1","composer":"Erik Satie","year":"c. 1890, published 1893","composedYear":1890,"ageApprox":true,"place":"Paris, France","instruments":"Solo piano","reception":"How it was first received is not recorded. It was first printed in the magazine Le Figaro musical in 1893."},{"title":"Nocturne in E-flat major, Op. 9 No. 2","composer":"Frédéric Chopin","year":"1830–32, published 1832","composedYear":1830,"ageApprox":true,"place":"On the move between Warsaw, Vienna and Paris","instruments":"Solo piano","reception":"Critics were mixed about Chopin’s nocturnes when they came out. This one is now often called his most famous piece."},{"title":"Cello Suite No. 1 in G major: Prelude","composer":"Johann Sebastian Bach","year":"c. 1717–23","composedYear":1720,"ageApprox":true,"place":"Probably Köthen, Germany","instruments":"Solo cello","reception":"The suites stayed largely unknown until Pablo Casals found an edition in 1889. His 1936–39 recordings made them famous."},{"title":"Träumerei","composer":"Robert Schumann","year":"1838","composedYear":1838,"beforeBirthday":true,"place":"Leipzig, Germany","instruments":"Solo piano","reception":"Clara Wieck, who married Schumann in 1840, loved the set. How the wider public first received it is less well recorded."},{"title":"Prelude in C major, BWV 846","composer":"Johann Sebastian Bach","year":"c. 1720–22, printed 1801","composedYear":1720,"ageApprox":true,"place":"Köthen, Germany","instruments":"Keyboard: harpsichord or clavichord","reception":"It passed around in handwritten copies and was not printed until 1801, 51 years after Bach died."},{"title":"Peer Gynt: Morning Mood","composer":"Edvard Grieg","year":"1874–75, first performed 1876","composedYear":1874,"ageApprox":true,"place":"Bergen, Norway","instruments":"Orchestra: woodwind, horns, trumpets, timpani and strings","reception":"The 1876 premiere in Christiania (now Oslo) was a triumph. The Peer Gynt suites became some of Grieg’s best-known works."},{"title":"Piano Sonata No. 16 in C major, K. 545: Allegro","composer":"Wolfgang Amadeus Mozart","year":"1788, published 1805","composedYear":1788,"place":"Vienna, Austria","instruments":"Solo piano","reception":"Mozart called it “a little keyboard sonata for beginners”. It was not published in his lifetime."},{"title":"Air on the G String","composer":"Johann Sebastian Bach","year":"c. 1730","composedYear":1730,"ageApprox":true,"place":"Leipzig, Germany","instruments":"Strings and continuo","reception":"How it was received in Bach’s day is not recorded. It became famous through August Wilhelmj’s 1871 violin arrangement."},{"title":"Moonlight Sonata: Adagio sostenuto","composer":"Ludwig van Beethoven","year":"1801, published 1802","composedYear":1801,"beforeBirthday":true,"ageApprox":true,"place":"Vienna, Austria","instruments":"Solo piano","reception":"Already popular in his lifetime. His pupil Czerny reported him grumbling, “Surely I’ve written better things.”"},{"title":"The Carnival of the Animals: The Swan","composer":"Camille Saint-Saëns","year":"1886, published 1887","composedYear":1886,"beforeBirthday":true,"place":"A small village in Austria, on holiday","instruments":"Cello and two pianos","reception":"Saint-Saëns banned publication of the Carnival in his lifetime, except for The Swan, which he allowed in 1887."},{"title":"Venetian Gondola Song, Op. 30 No. 6","composer":"Felix Mendelssohn","year":"1833–34, published 1835","composedYear":1833,"ageApprox":true,"place":"Probably Düsseldorf, Germany","instruments":"Solo piano","reception":"His Songs Without Words were widely popular with amateur pianists, and he went on to publish eight books of them."},{"title":"Nocturne in E minor, Op. 72 No. 1","composer":"Frédéric Chopin","year":"1827, published 1855","composedYear":1827,"ageApprox":true,"place":"Warsaw, Poland","instruments":"Solo piano","reception":"Published only after his death, so it had no audience in his lifetime. It was his first nocturne."}];
const COMPOSERS={"Erik Satie":{"born":1866,"died":1925,"bornPlace":"Honfleur, France","origin":"French","money":"Earned a modest living as a cabaret pianist and was often short of money; from 1898 he lived in one room in Arcueil.","also":"Left the Paris Conservatoire in 1882, then went back to study at the Schola Cantorum at 39."},"Claude Debussy":{"born":1862,"died":1918,"bornPlace":"Saint-Germain-en-Laye, France","origin":"French","money":"Had a taste for luxury and a reputation for debts, and topped up his income by teaching and writing.","also":"Entered the Paris Conservatoire at ten and won the Prix de Rome in 1884."},"Johann Sebastian Bach":{"born":1685,"died":1750,"bornPlace":"Eisenach, Germany","origin":"German","money":"A salaried musician all his life: well paid as court music director at Köthen, then cantor of St Thomas in Leipzig.","also":"Had 20 children; four became composers."},"Frédéric Chopin":{"born":1810,"died":1849,"bornPlace":"Żelazowa Wola, Poland","origin":"Polish","money":"Earned a handsome income from publishing and from teaching wealthy pupils, so he rarely needed to give public concerts.","also":"Left Poland in 1830, never returned, and settled in Paris."},"Robert Schumann":{"born":1810,"died":1856,"bornPlace":"Zwickau, Germany","origin":"German","money":"Clara Wieck’s father opposed their marriage, doubting he could provide for her; she was the better-known performer.","also":"An injured finger ended his hopes of a concert career, so he turned to composing."},"Edvard Grieg":{"born":1843,"died":1907,"bornPlace":"Bergen, Norway","origin":"Norwegian","money":"From 1874 he received a yearly artist’s stipend from the Norwegian state.","also":"Trained at the Leipzig Conservatory."},"Wolfgang Amadeus Mozart":{"born":1756,"died":1791,"bornPlace":"Salzburg, now Austria","origin":"Austrian","money":"By 1788 his income had fallen sharply, and he wrote to his friend Michael Puchberg begging for loans.","also":"Toured Europe’s courts as a child prodigy for three and a half years."},"Ludwig van Beethoven":{"born":1770,"died":1827,"bornPlace":"Bonn, Germany","origin":"German","money":"From 1809, three noble patrons promised him 4,000 florins a year to stay in Vienna, though not all kept paying.","also":"His hearing began to fail around 1798."},"Camille Saint-Saëns":{"born":1835,"died":1921,"bornPlace":"Paris, France","origin":"French","money":"His post as organist at La Madeleine paid comfortably, and a later legacy let him concentrate on composing.","also":"A child prodigy with perfect pitch before he was three."},"Felix Mendelssohn":{"born":1809,"died":1847,"bornPlace":"Hamburg, Germany","origin":"German","money":"Came from a wealthy family; his father, Abraham, was a banker.","also":"In 1829 he conducted Bach’s St Matthew Passion in Berlin, sparking the Bach revival."}};
for(const t of TRACKS){t.c=COMPOSERS[t.composer];t.age=t.composedYear-t.c.born-(t.beforeBirthday?1:0);}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ageText=t=>(t.ageApprox?"about ":"")+t.age;
let idx=0,playing=false;
// Stand-in painting: seeded, dithered cubist planes (the real site paints each piece).
const cv=$("#art"),cx=cv.getContext("2d");cv.width=160;cv.height=100;
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function seeded(s){return()=>{s=(s+0x6d2b79f5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function paint(i){const r=seeded(i*97+13),h=r()*360,img=cx.createImageData(160,100),d=img.data;
  const pal=[0,1,2,3,4].map(k=>{const l=14+k*13+r()*6,s=30+r()*30,hh=(h+(k%2?28:-18)*r())%360;return hsl(hh,s,l)});
  const rects=[];(function split(x,y,w,h,dep){if(dep===0||w<14||h<10){rects.push([x,y,w,h,Math.floor(r()*5),Math.floor(r()*5),Math.floor(r()*9)]);return}
    if(w>h*1.3||(r()<.5&&w>20)){const s=Math.floor(w*(.3+r()*.4));split(x,y,s,h,dep-1);split(x+s,y,w-s,h,dep-1)}
    else{const s=Math.floor(h*(.3+r()*.4));split(x,y,w,s,dep-1);split(x,y+s,w,h-s,dep-1)}})(0,0,160,100,6);
  for(const[x,y,w,h,a,b,lv]of rects)for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){const c=pal[BAY[(yy&3)*4+(xx&3)]<lv?b:a],o=(yy*160+xx)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}
  cx.putImageData(img,0,0)}
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]}
function show(i){idx=(i+TRACKS.length)%TRACKS.length;const t=TRACKS[idx];paint(idx);
  $("#title").textContent=t.title;$("#composer").textContent=t.composer;cv.setAttribute("aria-label","Stand-in painting for "+t.title);
  if(window.onTrack)onTrack(t);}
$("#play").onclick=()=>{playing=!playing;$("#play").setAttribute("aria-label",playing?"Pause":"Play");$("#playGlyph").setAttribute("d",playing?"M5 4h3.5v12H5zM11.5 4H15v12h-3.5z":"M6 3.5v13L16.5 10z");if(window.onPlay)onPlay(playing)};
$("#next").onclick=()=>show(idx+1);
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest("input"))return;
  if(e.key==="ArrowRight"){show(idx+1);e.preventDefault()}else if(e.key==="ArrowLeft"){show(idx-1);e.preventDefault()}
  else if(e.key===" "&&!e.target.closest("button")){$("#play").click();e.preventDefault()}
  else if(window.onKey)onKey(e)});


function onTrack(t){$("#sc").innerHTML=`<h2>${esc(t.title)}</h2><dl>
<div><dt class="k">Year</dt><dd>${esc(t.year)}</dd></div><div><dt class="k">Written in</dt><dd>${esc(t.place)}</dd></div>
<div><dt class="k">Instruments</dt><dd>${esc(t.instruments)}</dd></div><div><dt class="k">In its day</dt><dd>${esc(t.reception)}</dd></div></dl>
<h2>${esc(t.composer)}</h2><p class="age"><b>${t.age}</b><span>${t.ageApprox?"about this age":"years old"}<br>when writing it</span></p><dl>
<div><dt class="k">From</dt><dd>Born ${t.c.born} in ${esc(t.c.bornPlace)}; died ${t.c.died}</dd></div>
<div><dt class="k">Money</dt><dd>${esc(t.c.money)}</dd></div><div><dt class="k">Also</dt><dd>${esc(t.c.also)}</dd></div></dl>`}
const sh=$("#sheet"),nb=$("#notes");
function toggle(o){o=o??!sh.classList.contains("open");sh.classList.toggle("open",o);document.body.classList.toggle("sheet-on",o);nb.setAttribute("aria-expanded",o);if(o)$("#close").focus({preventScroll:true})}
nb.onclick=()=>toggle();$("#close").onclick=()=>{toggle(false);nb.focus()};
function onKey(e){if(e.key==="n"||e.key==="N")toggle();else if(e.key==="Escape")toggle(false)}
setTimeout(()=>toggle(true),500);
show(0);
</script>
</body>
</html>
